<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Example HTML Tool</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1020;color:#f5f6ff;font:16px system-ui;padding:24px}.card{max-width:560px;padding:32px;border:1px solid #39415f;border-radius:22px;background:#141d32;box-shadow:0 25px 80px #0005}h1{font-size:clamp(28px,6vw,42px);margin:0 0 12px}p{color:#aab6cf;line-height:1.7}.pill{display:inline-block;padding:6px 10px;border-radius:99px;background:#29234d;color:#c7bbff;font-size:12px}button{padding:11px 16px;border:0;border-radius:10px;background:#806cff;color:white;font-weight:700;cursor:pointer}
</style>
</head>
<body><main class="card"><span class="pill">SAMPLE DOWNLOAD</span><h1>Hello from your HTML project.</h1><p>This is a simple example file included with Ghassan Store. You can replace it with your own HTML app or project.</p><button onclick="document.getElementById('message').textContent='It works! You can customize this file.'">Test interaction</button><p id="message" aria-live="polite"></p></main></body>
</html>
