<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Ghassan Store — discover apps, tools, files and downloads.">
<meta name="theme-color" content="#101522">
<title>Ghassan Store | Apps & Downloads</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="./"><span class="brand-mark">G</span><span>Ghassan <b>Store</b><small>by Ghassan Bin Zia</small></span></a>
  <a class="admin-link" href="admin.html">Admin</a>
</header>
<main>
<section class="hero">
  <div class="eyebrow">YOUR DIGITAL COLLECTION</div>
  <h1>Find your next <span>favorite.</span></h1>
  <p>Apps, useful tools, images and files — collected in one place.</p>
  <label class="search"><span>⌕</span><input id="search" type="search" placeholder="Search items…" autocomplete="off"></label>
  <div class="filters" id="filters">
    <button class="filter active" data-filter="all">All items</button>
    <button class="filter" data-filter="app">Apps</button>
    <button class="filter" data-filter="tool">Tools</button>
    <button class="filter" data-filter="file">Files</button>
    <button class="filter" data-filter="image">Images</button>
  </div>
</section>
<section class="catalog-section">
  <div class="section-head"><div><div class="eyebrow">THE COLLECTION</div><h2>Explore downloads</h2></div><span id="count" class="count">Loading…</span></div>
  <div id="status" class="status">Loading store catalogue…</div>
  <div id="items" class="items"></div>
</section>
</main>
<footer><span>© <span id="year"></span> Ghassan Store</span><span>Made by Ghassan Bin Zia</span></footer>
<script src="app.js"></script>
</body></html>
